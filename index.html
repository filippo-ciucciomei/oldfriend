<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Old Friend</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

   <!-- Fixed Header -->
    <header class="site-header">
        <h1 class="logo">Old Friend</h1>
        
       <!-- Michelin Badge -->
        <div class="michelin-badge">
            <span class="michelin-title">MICHELIN</span> 
            <span class="michelin-subtitle">Guide 2026</span>
        </div>
    </header>

    <!-- Accordion Sections -->
    <main class="menu-container">
        
        <section class="menu-section">
            <h2 class="menu-title">Booking</h2>
            <div class="menu-content">
                <p>Booking details will go here.</p>
            </div>
        </section>

        <section class="menu-section">
            <h2 class="menu-title">Menu</h2>
            <div class="menu-content">
                <p>Sample menu items will go here.</p>
            </div>
        </section>

        <section class="menu-section">
            <h2 class="menu-title">Images</h2>
            <div class="menu-content">
                <p>Restaurant images will go here.</p>
            </div>
        </section>

        <section class="menu-section">
            <h2 class="menu-title">Who we are</h2>
            <div class="menu-content">
                <p>Story and background will go here.</p>
            </div>
        </section>

        <section class="menu-section">
            <h2 class="menu-title">Contact</h2>
            <div class="menu-content">
                <p>Phone, email, and address will go here.</p>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
