<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Old Friend</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

   <!-- Fixed Header -->
    <header class="site-header">
        <h1 class="logo">Old Friend</h1>
        
       <!-- Michelin Badge -->
        <div class="michelin-badge">
            <img src="media/logos/michelin2026.png" alt="Michelin Guide 2026" class="michelin-img">
        </div>
    </header>

    <!-- Accordion Sections -->
    <main class="menu-container">
        
        <section class="menu-section">
            <h2 class="menu-title">Booking</h2>
            <div class="menu-content">
                <!-- Wrap the container in an anchor (link) tag -->
                <a href="https://oldfriend.superbexperience.com/reserve/experience" target="_blank" class="booking-link">
                    <div class="booking-image-container">
                        <img src="media/photos/image 05.jpeg" alt="Booking" class="booking-img">
                        <div class="booking-overlay">BOOK A<br>TABLE</div>
                    </div>
                </a>
            </div>
        </section>

         <!-- MENU SECTION BELOW -->
         <!-- Updated Menu Section -->
        <section class="menu-section">
            <h2 class="menu-title">Menu</h2>
            <div class="menu-content">
                <div id="dynamic-menu-container">Loading today's menus...</div>
            </div>
        </section>

    <!-- Menu Modal (Hidden by default) -->
    <div id="menu-modal" class="menu-modal">
        <div class="modal-close" id="modal-close">&times;</div>
        <div class="modal-content" id="modal-content">
            <!-- JavaScript will inject the specific menu and allergens here -->
        </div>
    </div>

    <!-- MENU SECTION ABOVE -->

        <section class="menu-section">
            <h2 class="menu-title">Images</h2>
            <div class="menu-content">
                <!-- Carousel Container -->
                <div class="carousel-container" id="image-carousel">
                    <div class="carousel-track" id="carousel-track">
                        <!-- JavaScript will inject the images here -->
                    </div>
                </div>
            </div>
        </section>


        <section class="menu-section">
            <h2 class="menu-title">Who we are</h2>
            <div class="menu-content">
                <p>Story and background will go here.</p>
            </div>
        </section>

        <section class="menu-section">
            <h2 class="menu-title">Contact</h2>
            <div class="menu-content">
                <p>Phone, email, and address will go here.</p>
            </div>
        </section>

    </main>

    <!-- Fixed Footer -->
    <footer class="site-footer">
        <div class="address">Via Giuseppe Abba, 51, Cagliari</div>
        
        <!-- Instagram Logo (SVG) -->
        <a href="https://www.instagram.com/oldfriendcagliari/" target="_blank" class="ig-link" aria-label="Instagram">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
            </svg>
        </a>
    </footer>

    <script src="script.js"></script>
</body>
</html>
